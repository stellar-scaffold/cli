name: rust

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - "website/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CI_BUILD: "--locked"
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup update
      - run: rustup target add wasm32v1-none
      - run: rustup component add rustfmt clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@just
      - uses: cargo-bins/cargo-binstall@main
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - uses: stellar/stellar-cli@v26.0.0
      - name: build since clippy needs contracts to be built
        run: just build
      - name: Run cargo clippy
        run: just clippy
      - name: Run cargo clippy on tests
        run: just clippy-test
      # Label a PR `cross-repo` to degit the UI from a same-named branch on the
      # UI repo, so coordinated cross-repo changes can go green before the UI
      # is released. Unlabeled PRs always use the main branch.
      - name: Resolve UI repo ref
        env:
          CROSS_REPO: ${{ contains(github.event.pull_request.labels.*.name, 'cross-repo') }}
        run: |
          REF="${{ github.head_ref }}"
          if [ "$CROSS_REPO" != "true" ]; then
            echo "Using default UI monorepo (main)."
            echo "To test against a UI branch, label this PR 'cross-repo'."
            exit 0
          fi
          if ! git ls-remote --exit-code --heads \
              https://github.com/stellar-scaffold/ui "$REF" >/dev/null 2>&1; then
            echo "::error::PR is labeled 'cross-repo' but no branch named" \
              "'$REF' exists on stellar-scaffold/ui. Push that branch, or" \
              "remove the label to use main."
            exit 1
          fi
          echo "STELLAR_SCAFFOLD_UI_REPO=stellar-scaffold/ui#$REF" >> "$GITHUB_ENV"
          echo "Pinned UI monorepo -> $REF"
      - name: Unit Tests
        run: just test
