name: rust

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths-ignore:
      - "website/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  CI_BUILD: "--locked"
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # rust-toolchain.toml pins the channel, components (rustfmt, clippy) and the
      # wasm32v1-none target; rustup auto-installs them on first use, so no
      # explicit `rustup update`/`target add`/`component add` is needed here.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libudev-dev
      - uses: taiki-e/install-action@nextest
      - uses: taiki-e/install-action@just
      - uses: cargo-bins/cargo-binstall@main
      - uses: mozilla-actions/sccache-action@v0.0.10
      - name: Run cargo fmt
        run: cargo fmt --all -- --check
      - uses: stellar/stellar-cli@v28.1.0
      - name: build since clippy needs contracts to be built
        run: just build
      - name: Run cargo clippy
        run: just clippy
      - name: Run cargo clippy on tests
        run: just clippy-test
      - name: Resolve UI repo ref
        uses: ./.github/actions/resolve-ui-ref
        with:
          cross-repo: ${{ contains(github.event.pull_request.labels.*.name, 'cross-repo') }}
          head-ref: ${{ github.head_ref }}
      # `generate contract --from oz/...` copies examples from the pinned OZ
      # release; they only compile if the UI template uses the same version.
      - name: Check OZ release matches UI template
        run: |
          repo="${STELLAR_SCAFFOLD_UI_REPO:-stellar-scaffold/ui}"
          ref="main"
          if [[ "$repo" == *#* ]]; then ref="${repo#*#}"; repo="${repo%%#*}"; fi
          pinned=$(sed -n 's/^const LATEST_SUPPORTED_OZ_RELEASE: &str = "v\(.*\)";/\1/p' \
            crates/stellar-scaffold-cli/src/commands/generate/contract/mod.rs)
          ui=$(curl -fsSL "https://raw.githubusercontent.com/$repo/$ref/Cargo.toml" \
            | sed -n 's/^stellar-tokens = "\(.*\)"/\1/p')
          echo "Pinned OZ release: $pinned, UI template stellar-tokens: $ui"
          if [ -z "$pinned" ] || [ "$pinned" != "$ui" ]; then
            echo "::error::LATEST_SUPPORTED_OZ_RELEASE (v$pinned) doesn't match stellar-tokens ($ui) in $repo@$ref Cargo.toml"
            exit 1
          fi
      - name: Unit Tests
        run: just test
